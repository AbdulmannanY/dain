name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Also run the live sign-in test against Supabase (test numbers)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are on their Node 24 majors (Node 20 is retired on runners), and
# runners are pinned to ubuntu-24.04 so the ubuntu-latest move to 26 does
# not change the toolchain under us.
jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        working-directory: .
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter=expanded

      - name: Live sign-in test (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.live
        run: flutter test test/live --dart-define=DAIN_LIVE=true --reporter=expanded

  apk:
    name: Android APK
    # After the app job passes, on pushes and manual runs (not on PRs).
    needs: app
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        working-directory: .
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      # The upload key lives only in repository secrets (made on the phone by
      # dain-16-keystore.sh). A missing secret fails the job instead of
      # silently signing with the debug key, which would block updates.
      - name: Upload key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.DAIN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DAIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAIN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAIN_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            # A space or line break pasted with a value breaks it; none of
            # the four values (base64, generated passwords, alias) has one.
            printf -v "$v" '%s' "$(printf '%s' "${!v}" | tr -d '[:space:]')"
            if [ -z "${!v}" ]; then
              echo "::error::secret DAIN_$v is missing (Settings -> Secrets and variables -> Actions)"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          # Fail here in seconds, not after a 4-minute Gradle build.
          if ! keytool -list -keystore android/app/upload-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::DAIN_KEYSTORE_PASSWORD or DAIN_KEY_ALIAS does not open DAIN_KEYSTORE_BASE64; paste them again from ~/.dain-keys/password.txt"
            exit 1
          fi
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: The APK is signed with the upload key, not the debug key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$certs" | grep -E "certificate (DN|SHA-256)"
          echo "$certs" | grep -q "certificate DN: CN=Dain" || {
            echo "::error::the APK is not signed with the Dain upload key"
            exit 1
          }

      - uses: actions/upload-artifact@v6
        with:
          name: dain-apk-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  share:
    name: Share page
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Page logic tests (no dependencies)
        run: node --test share/dain-share.test.mjs

  db:
    name: Database schema tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      - name: Migrations + RLS/RPC tests
        run: bash supabase/tests/run_tests.sh
