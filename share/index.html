<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The token is in the URL fragment: never sent, never passed on. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://mxnjwaofjlxxdjizjsfb.supabase.co; base-uri 'none'; form-action 'none'">
  <title>دائن · دفترك</title>
  <style>
    :root {
      --green: #0E6B4F; --red: #B3261E; --bg: #F7F9F8; --card: #FFFFFF;
      --text: #1B1C1B; --muted: #5F6662; --line: #DDE3E0;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --green: #7FD8B0; --red: #FFB4AB; --bg: #111413; --card: #1C201E;
        --text: #E2E3E1; --muted: #A9B0AC; --line: #333936;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    .page { max-width: 560px; margin: 0 auto; padding: 16px; }
    header h1 { color: var(--green); font-size: 22px; margin: 0 0 8px; }
    h2 { font-size: 20px; margin: 8px 0 4px; }
    .muted { color: var(--muted); font-size: 14px; }
    .error { color: var(--red); }
    .notice { color: var(--green); font-weight: 600; }
    .balance {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px; margin: 16px 0;
    }
    .balance .amount { font-size: 26px; font-weight: 700; }
    .entries { list-style: none; margin: 0; padding: 0; }
    .entries li {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 16px; margin-bottom: 8px;
    }
    .entry-title { font-weight: 600; }
    .actions, .dispute { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .dispute textarea {
      width: 100%; min-height: 72px; padding: 8px; font: inherit; color: inherit;
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    }
    button {
      flex: 1 1 120px; min-height: 44px; padding: 8px 16px; font: inherit;
      border: 0; border-radius: 22px; background: var(--green); color: #fff; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { color: #00382A; } }
    button.secondary { background: transparent; color: var(--green); border: 1px solid var(--green); }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <main id="app"><div class="page"><p class="muted">جارٍ التحميل…</p></div></main>
  <noscript><p class="page">هذه الصفحة تحتاج JavaScript.</p></noscript>
  <script type="module" src="dain-share.js"></script>
</body>
</html>
